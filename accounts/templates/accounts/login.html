<!DOCTYPE html>
{% load static %}
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#212529">
    <title>Accesso</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ CSS_VERSION }}">
</head>
<body>
<div class="container" style="max-width: 420px; margin-top: 8vh;">
    <div class="login-card"><div class="p-4 p-sm-5">
        <div class="text-center mb-4"><img src="{% static 'img/favicon.svg' %}" alt="" width="56" height="56" class="mb-3"><h1 class="h3 mb-0">Vinyl</h1></div>
        <button id="passkey-login" type="button" class="btn btn-primary w-100 mb-2">Accedi con impronta digitale</button>
        <div id="passkey-error" class="text-danger small mb-3" hidden></div>
        <hr>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}<div class="alert alert-danger py-2">Credenziali non valide.</div>{% endif %}
            <div class="mb-3"><input class="form-control" name="username" placeholder="Utente" autocomplete="username webauthn" autofocus required></div>
            <div class="mb-3"><input class="form-control" type="password" name="password" placeholder="Password" autocomplete="current-password" required></div>
            <button class="btn btn-outline-secondary w-100">Accedi con password</button>
        </form>
    </div></div>
</div>
<script>
const csrf = '{{ csrf_token }}';
const post = (url, body) => fetch(url, {method: 'POST', headers: {'X-CSRFToken': csrf, 'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
const btn = document.getElementById('passkey-login'), err = document.getElementById('passkey-error');
const supported = window.PublicKeyCredential && PublicKeyCredential.parseRequestOptionsFromJSON;
let ctrl = null;

async function passkeyLogin(conditional) {
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    err.hidden = true;
    try {
        const opts = await (await post('{% url "accounts:passkey_login_options" %}')).json();
        const cred = await navigator.credentials.get({
            publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(opts),
            mediation: conditional ? 'conditional' : 'optional',
            signal: ctrl.signal,
        });
        const r = await post('{% url "accounts:passkey_login_verify" %}?next={{ next|urlencode }}', {credential: cred.toJSON()});
        const data = await r.json();
        if (!r.ok) throw new Error(data.error);
        location.href = data.next;
    } catch (e) {
        if (e.name === 'AbortError') return;
        console.error(e);
        err.textContent = 'Accesso con passkey non riuscito: ' + (e.name || '') + ' ' + (e.message || ''); err.hidden = false;
    }
}

if (!supported) {
    btn.disabled = true;
} else {
    btn.addEventListener('click', () => passkeyLogin(false));
    // Autofill: l'impronta compare tra i suggerimenti del campo utente, senza cliccare nulla.
    PublicKeyCredential.isConditionalMediationAvailable?.().then(ok => {
        if (ok) passkeyLogin(true);
    });
}
</script>
</body>
</html>
