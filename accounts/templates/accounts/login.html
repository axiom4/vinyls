<!DOCTYPE html>
{% load static %}
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 12vh;">
    <div class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">🎵 La Mia Collezione</h1>
        <button id="passkey-login" type="button" class="btn btn-dark w-100 mb-2">🔑 Accedi con impronta digitale</button>
        <div id="passkey-error" class="text-danger small mb-3" hidden></div>
        <hr>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}<div class="alert alert-danger py-2">Credenziali non valide.</div>{% endif %}
            <div class="mb-3"><input class="form-control" name="username" placeholder="Utente" autocomplete="username webauthn" required></div>
            <div class="mb-3"><input class="form-control" type="password" name="password" placeholder="Password" autocomplete="current-password" required></div>
            <button class="btn btn-outline-secondary w-100">Accedi con password</button>
        </form>
    </div></div>
</div>
<script>
const csrf = '{{ csrf_token }}';
const post = (url, body) => fetch(url, {method: 'POST', headers: {'X-CSRFToken': csrf, 'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
const btn = document.getElementById('passkey-login'), err = document.getElementById('passkey-error');
if (!window.PublicKeyCredential || !PublicKeyCredential.parseRequestOptionsFromJSON) btn.disabled = true;
btn.addEventListener('click', async () => {
    err.hidden = true;
    try {
        const opts = await (await post('{% url "accounts:passkey_login_options" %}')).json();
        const cred = await navigator.credentials.get({publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(opts)});
        const r = await post('{% url "accounts:passkey_login_verify" %}?next={{ next|urlencode }}', {credential: cred.toJSON()});
        const data = await r.json();
        if (!r.ok) throw new Error(data.error);
        location.href = data.next;
    } catch (e) { err.textContent = 'Accesso con passkey non riuscito.'; err.hidden = false; }
});
</script>
</body>
</html>
