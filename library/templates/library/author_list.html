{% extends 'library/base.html' %}

{% block title %}Autori - La Mia Libreria{% endblock %}

{% block content %}
<h1>Autori</h1>

{% if authors %}
<div class="list-group">
    {% for author in authors %}
    <a href="{% url 'library:book_list' %}?q={{ author.last_name }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ author }}
        <span class="badge bg-primary rounded-pill">{{ author.books.count }} libro/i</span>
    </a>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-info">Nessun autore trovato.</div>
{% endif %}
{% endblock %}
