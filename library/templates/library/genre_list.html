{% extends 'library/base.html' %}

{% block title %}Generi - La Mia Libreria{% endblock %}

{% block content %}
<h1>Generi</h1>

{% if genres %}
<div class="d-flex flex-wrap gap-2">
    {% for genre in genres %}
    <a href="{% url 'library:book_list' %}?genre={{ genre.id }}" class="badge bg-info text-dark text-decoration-none p-2 fs-6">
        {{ genre.name }} <span class="badge bg-dark ms-1">{{ genre.book_set.count }}</span>
    </a>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-info">Nessun genere trovato.</div>
{% endif %}
{% endblock %}
