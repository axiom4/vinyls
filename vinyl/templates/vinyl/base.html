{% extends 'library/base.html' %}
{% load i18n %}

{% block navbar_actions %}
<form class="d-flex" role="search" method="get" action="{% url 'vinyl:vinyl_list' %}">
    <input class="form-control me-2" type="search" name="q" data-live-search autocomplete="off" placeholder="{% trans 'Cerca vinili...' %}" value="{{ query|default:'' }}">
    <button class="btn btn-outline-light" type="submit">{% trans "Cerca" %}</button>
</form>
<a href="{% url 'vinyl:vinyl_add' %}" class="btn btn-success ms-2">{% trans "+ Aggiungi vinile" %}</a>
{% endblock %}
